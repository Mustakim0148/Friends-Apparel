<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="faGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Badge Background -->
  <rect width="100" height="100" rx="24" fill="url(#faGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Decorative top crown/tiara accent -->
  <path d="M40 26 L50 21 L60 26 L56 31 L44 31 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
  <circle cx="50" cy="19" r="2.5" fill="#fef08a" />
  <circle cx="39" cy="24" r="1.8" fill="#fef08a" />
  <circle cx="61" cy="24" r="1.8" fill="#fef08a" />

  <!-- Monogram FA -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Letter F -->
    <path d="M30 36 H46 C47.5 36 48 37 48 38.5 C48 40 47.5 41 46 41 H36 V51 H44 C45.5 51 46 52 46 53.5 C46 55 45.5 56 44 56 H36 V74 C36 75.5 35 76 33 76 C31 76 30 75.5 30 74 Z" />
    <!-- Letter A -->
    <path d="M57 76 C55.5 76 54.5 75 55 73.5 L64 37 C64.5 35.5 65.5 35 67 35 C68.5 35 69.5 35.5 70 37 L79 73.5 C79.5 75 78.5 76 77 76 C75.5 76 74.5 75 74 73.5 L71.5 63 H62.5 L60 73.5 C59.5 75 58.5 76 57 76 Z M64 57 H70 L67 44.5 Z" />
  </g>

  <!-- Sparkle dot / star accent -->
  <circle cx="67" cy="80" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="33" cy="80" r="1.5" fill="#fef08a" opacity="0.8" />
</svg>
